<div class="container-fluid">
  <div class="row">

    <!-- COLUMNA IZQUIERDA: LISTA -->
    <div class="col-12 col-md-4 col-lg-3 p-3">
      <app-players (playerSelected)="onPlayerSelected($event)"></app-players>
    </div>

    <!-- COLUMNA CENTRAL: DETALLE -->
    <div class="col-12 col-md-4 col-lg-4 p-4">
      <app-detail [selectedPlayer]="selectedPlayer"></app-detail>
    </div>

    <!-- COLUMNA DERECHA: MEDIA -->
    <div class="col-12 col-md-4 col-lg-5 p-4">
      <app-media [selectedPlayer]="selectedPlayer"></app-media>
    </div>

  </div>
</div>
