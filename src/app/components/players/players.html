<input type="text" [(ngModel)]="search" placeholder="Buscar jugador..." class="search-input">

<ul>
  <li *ngFor="let player of players | filterPlayers: search">
    <a [routerLink]="['/detail', player.id]">
      {{ player.nombre }} {{ player.apellidos }} - {{ player.posicion }}
    </a>
  </li>
</ul>
